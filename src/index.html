        <style>
            html,
            body,
            main {
                background-color: #131315;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: 100% !important;
                overflow: hidden !important;
            }
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 300,
                    "GRAD" 0,
                    "opsz" 24;
            }
            .glass-base {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
            .inner-glow {
                box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
            }
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }

            .blur-overlay {
                backdrop-filter: blur(12px);
                opacity: 0;
                transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            }
            .player-paused .blur-overlay {
                opacity: 1;
            }
            .player-active.is-hovered .blur-overlay {
                opacity: 0.16;
            }

            .vignette-overlay {
                background: radial-gradient(
                    circle,
                    rgba(0, 0, 0, 0) 30%,
                    rgba(0, 0, 0, 0.55) 100%
                );
                opacity: 0;
                transition: opacity 2000ms cubic-bezier(0.25, 1, 0.5, 1);
                pointer-events: none;
            }
            .player-active.is-hovered .vignette-overlay {
                opacity: 1;
            }

            .player-active .play-icon {
                display: none;
            }
            .player-active .pause-icon {
                display: block;
                opacity: 0;
            }

            .is-hovered .pause-icon {
                opacity: 0.7;
            }

            .player-paused .play-icon {
                display: block;
            }
            .player-paused .pause-icon {
                display: none;
            }

            .player-paused .song-meta-top {
                opacity: 1;
                transform: translateY(0);
            }
            .player-active .song-meta-top {
                opacity: 0;
                transform: translateY(-10px);
            }
            .is-hovered .song-meta-top {
                opacity: 1 !important;
                transform: translateY(0) !important;
            }

            .player-paused .artist-meta-bottom {
                opacity: 1;
                transform: translateY(0);
            }
            .player-active .artist-meta-bottom {
                opacity: 0;
                transform: translateY(10px);
            }

            .is-hovered .artist-meta-bottom {
                opacity: 1 !important;
                transform: translateY(0) !important;
            }

            .is-hovered .bottom-controls-reveal {
                opacity: 1 !important;
            }
            .player-paused .bottom-controls-reveal {
                opacity: 1 !important;
            }

            .transition-all-custom {
                transition:
                    opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                    transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            }

            .hover-reveal {
                opacity: 0;
                transform: translateY(-50%);
                transition:
                    opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                    transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            }
            .is-hovered .hover-reveal {
                opacity: 1;
                transform: translateY(-50%);
            }

            .hollow-icon {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 200;
            }

            #playerContainer {
                width: 100vmin !important;
                height: 100vmin !important;
            }

            #albumArt {
                transition: transform 2000ms cubic-bezier(0.25, 1, 0.5, 1);
            }
            .is-hovered #albumArt {
                transform: scale(1.04);
            }

            #volumeSliderHorizontal {
                -webkit-appearance: none;
                appearance: none;
                width: 76px;
                height: 4px;
                border-radius: 99px;
                outline: none;
                cursor: pointer;
                background: linear-gradient(
                    to right,
                    rgba(255, 255, 255, 0.65) 0%,
                    rgba(255, 255, 255, 0.65) 65%,
                    rgba(255, 255, 255, 0.15) 65%,
                    rgba(255, 255, 255, 0.15) 100%
                );
                transition: width 0.2s ease;
            }

            #volumeSliderHorizontal::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 11px;
                height: 11px;
                background: rgba(255, 255, 255, 0.75);
                border-radius: 50%;
                cursor: pointer;
                transition: background-color 0.15s ease;
                box-shadow: none;
                border: none;
            }

            #volumeSliderHorizontal::-webkit-slider-thumb:hover {
                background: #ffffff;
            }

            .volume-panel-hidden {
                opacity: 0;
                transform: translateX(-6px);
                pointer-events: none;
                width: 0px;
                overflow: hidden;
            }

            .volume-panel-visible {
                opacity: 1;
                transform: translateX(0);
                pointer-events: auto;
                width: 110px;
            }

            #progressRing {
                transform: rotate(-90deg);
                transform-origin: center;
            }

            .progress-ring__circle {
                transition: stroke-dashoffset 0.5s linear;
                stroke-linecap: round;
            }
        </style>

        <main

                id="playerContainer"
            >
                <div
                    class="relative w-full h-full rounded-none overflow-hidden glass-base inner-glow shadow-2xl transition-all-custom cursor-pointer"
                    id="miniPlayer"
                >
                    <img
                        alt="Album Art"
                        class="absolute inset-0 w-full h-full object-cover z-0 rounded-none"
                        id="albumArt"
                        src=""
                    />

                    <div
                        class="blur-overlay absolute inset-0 z-10 bg-black/25"
                    ></div>

                    <div class="vignette-overlay absolute inset-0 z-10"></div>

                    <div class="absolute inset-0 z-20">
                        <div
                            class="song-meta-top absolute top-[10%] left-0 right-0 px-[8%] text-center transition-all-custom flex-col flex items-center"
                        >
                            <h2
                                class="font-headline-md text-primary truncate drop-shadow-lg text-sm @[290px]:text-base @[310px]:text-lg"
                            >
                                Searching...
                            </h2>
                            <p
                                class="artist-meta-bottom tracking-widest uppercase transition-all-custom mt-2 text-[9px] @[290px]:text-[10px] @[310px]:text-xs text-primary/80"
                            >
                                Connecting spotifyd
                            </p>
                        </div>

                        <div
                            class="absolute inset-0 flex items-center justify-center pointer-events-none"
                        >
                            <div
                                class="relative w-[34%] h-[34%] flex items-center justify-center pointer-events-auto"
                            >
                                <svg
                                    class="absolute inset-0 w-full h-full -rotate-90 opacity-0 transition-opacity duration-500"
                                    id="mprisProgressRing"
                                    viewbox="0 0 100 100"
                                >
                                    <circle
                                        class="text-primary/10"
                                        cx="50"
                                        cy="50"
                                        fill="transparent"
                                        r="45"
                                        stroke="currentColor"
                                        stroke-width="1.5"
                                    ></circle>
                                    <circle
                                        class="progress-ring__circle text-primary/60"
                                        cx="50"
                                        cy="50"
                                        fill="transparent"
                                        id="progressRing"
                                        r="45"
                                        stroke="currentColor"

                                        stroke-dashoffset="282.743"

                                </svg>
                                <div
                                    class="text-primary flex items-center justify-center transition-all duration-300 relative z-10"
                                >
                                    <span

                                    >
                                    <span
                                        class="material-symbols-outlined pause-icon hollow-icon text-primary/70 text-3xl @[290px]:text-4xl @[310px]:text-5xl"

                        <button
                            id="prevBtn"

                        >

                                >skip_previous</span

                        </button>
                        <button
                            id="nextBtn"
                            class="hover-reveal absolute right-[6%] top-1/2 text-primary/60 hover:text-primary transition-all duration-300"
                        >
                            <span
                                class="material-symbols-outlined text-2xl @[290px]:text-3xl @[310px]:text-4xl hollow-icon"
                                >skip_next</span
                            >
                        </button>

                        <div
                            class="absolute bottom-[8%] left-[8%] flex items-center"
                        >
                            <div
                                class="bottom-controls-reveal opacity-0 transition-opacity duration-300 flex items-center relative"
                            >
                                <div
                                    id="volumeGroup"
                                    class="relative flex items-center gap-3 group/volume"
                                >
                                    <button
                                        class="text-primary/60 hover:text-primary transition-all flex items-center justify-center"
                                        id="volumeIconBtn"
                                    >
                                        <span
                                            class="material-symbols-outlined text-xl @[310px]:text-2xl hollow-icon"
                                            id="volumeIcon"
                                            >volume_up</span
                                        >
                                    </button>
                                    <div
                                        class="flex items-center gap-2 volume-panel-hidden transition-all duration-300"
                                        id="volumePanel"
                                    >
                                        <input
                                            id="volumeSliderHorizontal"
                                            max="100"
                                            min="0"
                                            step="10"
                                            type="range"
                                            value="65"
                                        />
                                        <span
                                            class="font-light text-primary/60 text-xs select-none min-w-[24px]"
                                            id="volumePercent"
                                            >65%</span
                                        >

        <script>
            const playerContainer = document.getElementById("playerContainer");
            const miniPlayer = document.getElementById("miniPlayer");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");
            const volumeIconBtn = document.getElementById("volumeIconBtn");
            const volumeGroup = document.getElementById("volumeGroup");
            const volumeSlider = document.getElementById(
                "volumeSliderHorizontal",
            );
            const volumeIcon = document.getElementById("volumeIcon");
            const volumePanel = document.getElementById("volumePanel");
            const volumePercent = document.getElementById("volumePercent");
            const progressRing = document.getElementById("progressRing");
            const mprisProgressRing =
                document.getElementById("mprisProgressRing");
            const trackTitle = document.querySelector("h2");
            const artistMeta = document.querySelector(".artist-meta-bottom");
            const albumArt = document.getElementById("albumArt");

            let isPlaying = true;
            let isVolumePanelOpen = false;
            let isVolumeLocked = false;
            let volumeLockoutTimer = null;
            let isMouseInside = false;
            let hoverTimeout = null;

            const radius = 45;
            const circumference = radius * 2 * Math.PI;

            function setProgress(percent) {
                const offset = circumference - (percent / 100) * circumference;
                progressRing.style.strokeDashoffset = offset;
            }

            function togglePlayState(event) {
                if (event.target.closest("button")) return;
                if (event.target.closest('input[type="range"]')) return;
                if (event.target.closest("#volumePanel")) return;

                setHoverActive();
                window.__TAURI__.core.invoke("toggle_play_pause");
            }

            function toggleVolumePanel(event) {
                event.preventDefault();
                event.stopPropagation();
                isVolumePanelOpen = !isVolumePanelOpen;

                if (isVolumePanelOpen) {
                    volumePanel.classList.remove("volume-panel-hidden");
                    volumePanel.classList.add("volume-panel-visible");
                    if (hoverTimeout) clearTimeout(hoverTimeout);
                } else {
                    closeVolumePanel();
                }
            }

            function remove_focus() {
                if (document.activeElement) {
                    document.activeElement.blur();
                }
            }

            function closeVolumePanel() {
                isVolumeLocked = false;
                isVolumePanelOpen = false;
                volumePanel.classList.add("volume-panel-hidden");
                volumePanel.classList.remove("volume-panel-visible");
                remove_focus();
            }

            function updateVolume(value) {
                const val = parseInt(value);
                volumePercent.textContent = `${val}%`;
                isVolumeLocked = true;
                if (volumeLockoutTimer) clearTimeout(volumeLockoutTimer);
                volumeLockoutTimer = setTimeout(() => {
                    isVolumeLocked = false;
                }, 1000);

                volumeSlider.style.background = `linear-gradient(to right, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.65) ${val}%, rgba(255, 255, 255, 0.15) ${val}%, rgba(255, 255, 255, 0.15) 100%)`;

                if (val === 0) {
                    volumeIcon.textContent = "volume_off";
                } else if (val < 50) {
                    volumeIcon.textContent = "volume_down";
                } else {
                    volumeIcon.textContent = "volume_up";
                }

                window.__TAURI__.core.invoke("set_volume", {
                    volume: val / 100,
                });
            }

            function setHoverActive() {
                playerContainer.classList.add("is-hovered");
                mprisProgressRing.classList.remove("opacity-0");
                mprisProgressRing.classList.add("opacity-100");
            }

            function setHoverInactive() {
                playerContainer.classList.remove("is-hovered");
                mprisProgressRing.classList.remove("opacity-100");
                mprisProgressRing.classList.add("opacity-0");
                closeVolumePanel();
            }

            playerContainer.addEventListener("mousedown", (event) => {
                if (event.button === 1) {
                    event.preventDefault();
                }
            });

            miniPlayer.addEventListener("click", togglePlayState);
            miniPlayer.addEventListener("contextmenu", (event) =>
                event.preventDefault(),
            );

            prevBtn.addEventListener("click", (event) => {
                event.stopPropagation();
                window.__TAURI__.core.invoke("previous_track");
            });

            nextBtn.addEventListener("click", (event) => {
                event.stopPropagation();
                window.__TAURI__.core.invoke("next_track");
            });

            volumeIconBtn.addEventListener("mousedown", toggleVolumePanel);

            volumeGroup.addEventListener("click", (event) => {
                event.stopPropagation();
            });

            volumeSlider.addEventListener("input", (event) => {
                updateVolume(event.target.value);
            });

            playerContainer.addEventListener("mouseenter", () => {
                isMouseInside = true;
                setHoverActive();
            });

            playerContainer.addEventListener("mouseleave", () => {
                isMouseInside = false;
                setHoverInactive();
            });

            playerContainer.addEventListener("mousemove", () => {
                isMouseInside = true;
                setHoverActive();
                if (hoverTimeout) clearTimeout(hoverTimeout);
                if (isVolumePanelOpen) return;
                hoverTimeout = setTimeout(() => {
                    isMouseInside = false;
                    setHoverInactive();
                }, 800);
            });

            document.addEventListener("mouseleave", () => {
                isMouseInside = false;
                setHoverInactive();
            });

            document.addEventListener("mouseout", (e) => {
                if (!e.relatedTarget) {
                    isMouseInside = false;
                    setHoverInactive();
                }
            });

            window.addEventListener("blur", () => {
                isMouseInside = false;
                setHoverInactive();
            });

            window.addEventListener("mousedown", (e) => {
                if (!playerContainer.contains(e.target)) {
                    closeVolumePanel();
                } else if (!e.target.closest(".group\\/volume")) {
                    closeVolumePanel();
                }
            });

            window.addEventListener("DOMContentLoaded", async () => {
                setProgress(0);

                window.__TAURI__.event.listen("mpris-status", (event) => {
                    const state = event.payload;

                    trackTitle.textContent = state.track_title;
                    artistMeta.textContent = state.artist;

                    const albumArt = document.getElementById("albumArt");
                    if (state.album_art && state.album_art !== "") {
                        albumArt.src = state.album_art;
                    } else {
                        albumArt.src =
